[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["paxini_utils"]
module-root = "src"

[project]
name = "paxini-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
